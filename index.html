<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#172b4d"><link rel="manifest" href="manifest.json"><title>아침 뉴스 브리핑</title><style>
:root{color-scheme:light;font-family:-apple-system,BlinkMacSystemFont,'Noto Sans KR',sans-serif;background:#f5f7fb;color:#18263b}*{box-sizing:border-box}body{margin:0}header{background:#172b4d;color:white;padding:24px max(20px,calc((100vw - 950px)/2))}header small{color:#b9c8db}h1{font-size:27px;margin:8px 0}main{max-width:950px;margin:24px auto;padding:0 18px}.sub{color:#5d6b7c;font-size:13px}button,select{border:1px solid #d8e0ea;background:white;border-radius:12px;padding:10px;font-size:14px}button{cursor:pointer}.filters{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 22px}.filters button.active{background:#172b4d;color:white}.card{background:white;padding:19px;border-radius:17px;margin:12px 0;box-shadow:0 3px 14px #132d4810}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.tag{font-size:12px;background:#ecf1f8;color:#3a5574;padding:5px 9px;border-radius:20px}.card h2{font-size:18px;line-height:1.5;margin:12px 0}.links a{display:inline-block;margin:7px 12px 0 0;font-size:13px;color:#1a5d9b;text-decoration:none}.status{background:#e9f0fa;padding:15px;border-radius:12px;line-height:1.5}.count{font-weight:700;color:#2c4e74}footer{font-size:12px;color:#64758b;margin:25px 0 40px}.hidden{display:none}
</style></head><body><header><small>DAILY NEWS INTELLIGENCE · 오전 07:30</small><h1>국내외 주요뉴스 브리핑</h1><div>경제 · 사회 · 정책 | 언론 보도 집중도 순</div></header><main><div class="status" id="status">뉴스를 불러오려면 '새로고침'을 선택하십시오.</div><div class="filters"><button class="active" data-filter="전체">전체</button><button data-filter="경제">경제</button><button data-filter="사회">사회</button><button data-filter="정책">정책</button><button data-filter="국내">국내</button><button data-filter="해외">해외</button><button id="refresh">↻ 새로고침</button></div><div id="news"></div><footer>보도 집중도는 수집된 공개 RSS 기사 표본 기준의 상대적 지표이며, 전체 언론사의 보도 건수 통계가 아닙니다. 기사 요약 전문은 제공하지 않고 원문으로 연결합니다. 매일 07:30 알림은 별도로 설정한 ChatGPT 예약 브리핑에서 받습니다.</footer></main><script>
let rows=[],filter='전체';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(){let list=rows.filter(x=>filter==='전체'||x.category===filter||x.region===filter);document.querySelector('#news').innerHTML=list.length?list.map((v,i)=>`<article class="card"><div class="top"><span class="tag">${esc(v.region)} · ${esc(v.category)}</span><span class="sub"><span class="count">${v.publishers}개 매체</span> · 표본 ${v.coverage}건</span></div><h2>${i+1}. ${esc(v.title)}</h2><div class="links">${v.articles.slice(0,4).map(a=>`<a href="${esc(a.url)}" target="_blank" rel="noopener noreferrer">${esc(a.publisher)} 원문 ↗</a>`).join('')}</div></article>`).join(''):'<div class="card">해당 조건의 기사가 없습니다.</div>'}async function load(){let status=document.querySelector('#status');status.textContent='최신 뉴스를 수집 중입니다…';try{let r=await fetch('/api/news');if(!r.ok)throw Error('서버 통신 오류');let data=await r.json();rows=data.items||[];status.textContent=`갱신: ${new Date(data.updated).toLocaleString('ko-KR')} · 검색 기사 표본 ${data.sample_size}건 · ${data.note}`+(data.errors.length?' 일부 검색 오류가 발생했습니다.':'');render()}catch(e){status.textContent='뉴스를 불러오지 못했습니다. Python 서버를 실행한 후 접속하십시오. ('+e.message+')'}}document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));render()});document.querySelector('#refresh').onclick=load;load();</script></body></html>
